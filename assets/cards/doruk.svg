<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="DORUK + Mert Studio">
  <title>DORUK + Mert Studio</title>
  <defs>
    <linearGradient id="gdoruk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="rdoruk" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".18"/><stop offset=".6" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <clipPath id="cdoruk"><rect width="580" height="250" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cdoruk)">
    <rect width="580" height="250" fill="#0f172a"/>
    <rect width="580" height="250" fill="url(#rdoruk)"/>
    <rect width="580" height="4" fill="url(#gdoruk)"/>
    <text x="32" y="44" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#f472b6">PROGRAMMING LANGUAGE · IDE</text>
    <text x="32" y="80" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#e2e8f0">DORUK + Mert Studio</text>
    <g transform="translate(528 36)" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
      <path d="M4 16 L16 4 M7 4 H16 V13"/>
    </g>
    <text x="32" y="112" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#94a3b8">A programming language with Turkish keywords: lexer, parser,</text><text x="32" y="136" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#94a3b8">semantic analyzer and interpreter, plus its own Qt IDE.</text>
    <text x="32" y="168" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#e2e8f0" opacity=".9">▸ eğer (x &gt; y) { yazdır("merhaba") }</text>
    <rect x="32" y="200" width="62" height="26" rx="13" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".35"/><text x="63.0" y="217.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f472b6">C++17</text><rect x="102" y="200" width="54" height="26" rx="13" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".35"/><text x="129.0" y="217.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f472b6">Qt 6</text><rect x="164" y="200" width="62" height="26" rx="13" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".35"/><text x="195.0" y="217.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f472b6">CMake</text><rect x="234" y="200" width="84" height="26" rx="13" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".35"/><text x="276.0" y="217.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f472b6">Electron</text>
